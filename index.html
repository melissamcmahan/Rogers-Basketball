<style>
  :root{
    --court: #142850;
    --court-line: #ffffff;
    --ink: #171a17;
    --muted: #5b6158;
    --win: #1f8a4c;
    --loss: #23241f;
    --paper: #f7f8f5;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  .header{
    background:
      radial-gradient(circle, rgba(255,255,255,0.25) 1.6px, transparent 1.8px),
      linear-gradient(150deg, #27447d 0%, #142850 55%, #0a1630 100%);
    background-size: 16px 16px, 100% 100%;
    background-position: 0 0, 0 0;
    color: var(--court-line);
    padding: 30px 20px 34px;
    position: relative;
    overflow: hidden;
    border-radius: 0 0 28px 28px;
  }
  .header .ball-bg{
    position:absolute;
    top: -14px;
    right: -10px;
    font-size: 120px;
    line-height: 1;
    opacity: 0.9;
    pointer-events:none;
    transform: rotate(10deg);
    z-index: 1;
  }
  .header .ball-sm{
    position:absolute;
    font-size: 30px;
    opacity: 0.28;
    pointer-events:none;
  }
  .header .ball-sm.b1{ top: 20px; left: 6%; transform: rotate(-15deg); }
  .header .content{ position:relative; z-index:2; }
  .header h1{
    margin:0;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: 0.2px;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    line-height: 1.1;
  }
  .header p{
    margin: 4px 0 0;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.85);
  }
  .record{
    display:flex;
    gap: 10px;
    margin-top: 18px;
  }
  .record .box{
    flex:1;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 10px 8px;
    text-align:center;
  }
  .record .box .n{ font-size: 22px; font-weight: 700; }
  .record .box .l{ font-size: 11px; color: rgba(244,241,234,0.7); text-transform: uppercase; letter-spacing: 0.06em; }
  .record .box.wins .n{ color: #7fd6a0; }
  .record .box.losses .n{ color: #f0a591; }

  .list{ padding: 16px 14px 40px; max-width: 480px; margin: 0 auto; }
  .section-label{
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 18px 4px 8px;
  }
  .game{
    background: #fff;
    border: 1px solid #e4e0d3;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .game .date{
    width: 52px;
    text-align:center;
    flex-shrink:0;
  }
  .game .date .dow{ font-size: 10px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .game .date .num{ font-size: 20px; font-weight: 700; color: var(--ink); line-height:1.1; }
  .game .info{ flex:1; min-width:0; }
  .game .weekday{ font-size: 11.5px; font-weight: 700; color: var(--court); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
  .game .opp{ font-size: 15px; font-weight: 600; }
  .game .meta{ font-size: 12.5px; color: var(--muted); margin-top:2px; }
  .game .home-tag{
    display:inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 5px;
    margin-left: 6px;
    text-transform: uppercase;
  }
  .home-tag.home{ background:#e2e7ee; color: var(--court); }
  .home-tag.away{ background:#ede8de; color: var(--muted); }

  .result-btns{ display:flex; gap:6px; flex-shrink:0; }
  .result-btns button{
    width: 40px; height: 40px;
    border-radius: 8px;
    border: 1px solid #ddd8c8;
    background: #fbfaf5;
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
  }
  .result-btns button.active-w{ background: var(--win); color:#fff; border-color: var(--win); }
  .result-btns button.active-l{ background: var(--loss); color:#fff; border-color: var(--loss); }

  .footer-note{
    text-align:center;
    font-size: 11.5px;
    color: var(--muted);
    padding: 10px 20px 30px;
  }
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
</style>
</head>
<body>

<h2 class="sr-only">Rogers Mounties varsity basketball schedule and season record, with tappable win/loss buttons on each game to keep your own running record.</h2>

<div class="header">
  <div class="ball-sm b1">🏀</div>
  <div class="ball-bg">🏀</div>
  <div class="content">
  <h1>Rogers Mounties</h1>
  <p>VARSITY BASKETBALL · BUILT FOR THE C.L.I.M.B.</p>
  <div class="record">
    <div class="box wins"><div class="n" id="winCount">0</div><div class="l">Wins</div></div>
    <div class="box losses"><div class="n" id="lossCount">0</div><div class="l">Losses</div></div>
    <div class="box"><div class="n" id="playedCount">0/0</div><div class="l">Played</div></div>
  </div>
  </div>
</div>

<div class="list" id="gameList"></div>

<div class="footer-note">Tap W or L after a game to keep your own running record.</div>

<script>
const GAMES = [
  { id:"g1",  date:"2026-11-12", opponent:"LR Southwest",   venue:"Heritage HS",        event:"Heritage Tipoff",     home:false, time:"5:00 PM" },
  { id:"g2",  date:"2026-11-13", opponent:"Sheridan",       venue:"Heritage HS",        event:"Heritage Tipoff",     home:false, time:"5:00 PM" },

  { id:"g6",  date:"2026-11-24", opponent:"Cabot",          venue:"Rogers HS",          event:null,                  home:true,  time:"2:15 PM" },
  { id:"g7",  date:"2026-12-03", opponent:"Little Rock Mills", venue:"Benton HS",       event:null,                  home:false, time:"8:30 PM" },
  { id:"g8",  date:"2026-12-08", opponent:"Providence",     venue:"Rogers HS",          event:null,                  home:true,  time:"6:30 PM" },
  { id:"g9",  date:"2026-12-10", opponent:"Nettleton",      venue:"Rogers HS",          event:"Arvest Hoopfest",     home:true,  time:"7:00 PM" },
  { id:"g10", date:"2026-12-11", opponent:"Southmoore",     venue:"Rogers HS",          event:"Arvest Hoopfest",     home:true,  time:"5:30 PM" },
  { id:"g11", date:"2026-12-12", opponent:"Conway",         venue:"Rogers HS",          event:"Arvest Hoopfest",     home:true,  time:"3:30 PM" },
  { id:"g12", date:"2026-12-15", opponent:"Heritage",       venue:"Rogers HS",          event:null,                  home:true,  time:"7:00 PM" },
  { id:"g13", date:"2026-12-18", opponent:"Bentonville",    venue:"Bentonville HS",     event:null,                  home:false, time:"7:00 PM" },
  { id:"g14", date:"2026-12-28", opponent:"TBD",            venue:"Highland, AR",       event:"Bad Boy Mower Classic", home:false, time:"Dec 28–30" },
  { id:"g15", date:"2027-01-05", opponent:"Southside",      venue:"Southside HS",       event:null,                  home:false, time:"7:00 PM" },
  { id:"g16", date:"2027-01-08", opponent:"Northside",      venue:"Rogers HS",          event:null,                  home:true,  time:"7:00 PM" },
  { id:"g17", date:"2027-01-12", opponent:"Har-Ber",        venue:"Rogers HS",          event:null,                  home:true,  time:"7:00 PM" },
  { id:"g18", date:"2027-01-15", opponent:"West",           venue:"Rogers HS",          event:null,                  home:true,  time:"7:00 PM" },
  { id:"g19", date:"2027-01-19", opponent:"Springdale",     venue:"Springdale HS",      event:null,                  home:false, time:"7:00 PM" },
  { id:"g20", date:"2027-01-22", opponent:"Fayetteville",   venue:"Fayetteville HS",    event:null,                  home:false, time:"7:00 PM" },
  { id:"g21", date:"2027-01-29", opponent:"Heritage",       venue:"Heritage HS",        event:null,                  home:false, time:"7:00 PM" },

  { id:"g26", date:"2027-02-16", opponent:"West",           venue:"West HS",           event:null,                  home:false, time:"7:00 PM" },
  { id:"g27", date:"2027-02-19", opponent:"Springdale",     venue:"Rogers HS",          event:null,                  home:true,  time:"7:00 PM" },
  { id:"g28", date:"2027-02-23", opponent:"Fayetteville",   venue:"Rogers HS",          event:null,                  home:true,  time:"7:00 PM" },
  { id:"g29", date:"2027-03-01", opponent:"TBD",            venue:"TBD",                event:"State Tournament",    home:false, time:"Mar 1–5" },
];

const dowNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function fmtDate(iso){
  const d = new Date(iso + "T00:00:00");
  return { dow: dowNames[d.getDay()], num: d.getDate(), month: d.toLocaleString("en-US",{month:"short"}) };
}

function loadResults(){
  try{
    const raw = localStorage.getItem("rogers-basketball-results");
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}

function saveResult(gameId, value){
  const current = loadResults();
  if(current[gameId] === value){
    delete current[gameId];
  }else{
    current[gameId] = value;
  }
  localStorage.setItem("rogers-basketball-results", JSON.stringify(current));
  return current;
}

function renderSummary(results){
  let wins=0, losses=0;
  Object.values(results).forEach(v=>{ if(v==="W") wins++; if(v==="L") losses++; });
  document.getElementById("winCount").textContent = wins;
  document.getElementById("lossCount").textContent = losses;
  document.getElementById("playedCount").textContent = (wins+losses) + "/" + GAMES.length;
}

function renderGames(results){
  const list = document.getElementById("gameList");
  list.innerHTML = "";
  GAMES.forEach(g=>{
    const d = fmtDate(g.date);
    const result = results[g.id];
    const meta = [g.event, g.venue, g.time].filter(Boolean).join(" · ");
    const row = document.createElement("div");
    row.className = "game";
    row.innerHTML = `
      <div class="date"><div class="dow">${d.month}</div><div class="num">${d.num}</div></div>
      <div class="info">
        <div class="weekday">${d.dow}</div>
        <div class="opp">vs ${g.opponent}<span class="home-tag ${g.home ? 'home':'away'}">${g.home ? 'Home':'Away'}</span></div>
        <div class="meta">${meta}</div>
      </div>
      <div class="result-btns">
        <button data-id="${g.id}" data-v="W" class="${result==='W' ? 'active-w' : ''}" aria-label="Mark win vs ${g.opponent}">W</button>
        <button data-id="${g.id}" data-v="L" class="${result==='L' ? 'active-l' : ''}" aria-label="Mark loss vs ${g.opponent}">L</button>
      </div>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = btn.getAttribute("data-id");
      const v = btn.getAttribute("data-v");
      const updated = saveResult(id, v);
      renderGames(updated);
      renderSummary(updated);
    });
  });
}

(()=>{
  const results = loadResults();
  renderGames(results);
  renderSummary(results);
})();
</script>

</body>
</html>
